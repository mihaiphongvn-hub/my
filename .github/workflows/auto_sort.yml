name: Auto Update Playlist With Logos

on:
  schedule:
    # 30 phút/lần, tránh phút 00/30 là thời điểm GitHub Actions dễ bị tải cao.
    - cron: '17,47 * * * *'
      timezone: 'Asia/Ho_Chi_Minh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-update-playlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Show run information
        shell: bash
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Branch: $GITHUB_REF_NAME"
          echo "UTC now: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check playlist secret
        shell: bash
        env:
          SOURCE_PLAYLIST_URL: ${{ secrets.SOURCE_PLAYLIST_URL }}
        run: |
          if [ -z "$SOURCE_PLAYLIST_URL" ]; then
            echo "::error::Thiếu secret SOURCE_PLAYLIST_URL"
            exit 1
          fi
          echo "SOURCE_PLAYLIST_URL: OK"

      - name: Update playlist and logos
        env:
          SOURCE_PLAYLIST_URL: ${{ secrets.SOURCE_PLAYLIST_URL }}
        run: python sort_m3u.py

      - name: Validate generated playlists
        shell: bash
        run: |
          set -e

          for file in playlist.m3u vtv.m3u; do
            if [ ! -f "$file" ]; then
              echo "::error::Không tạo được $file"
              exit 1
            fi

            if [ ! -s "$file" ]; then
              echo "::error::$file đang rỗng"
              exit 1
            fi

            if ! head -n 1 "$file" | grep -q "^#EXTM3U"; then
              echo "::error::$file không phải playlist M3U hợp lệ"
              exit 1
            fi
          done

          echo "Hai playlist hợp lệ."

      - name: Force refresh timestamp
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo

          stamp = datetime.now(
              ZoneInfo("Asia/Ho_Chi_Minh")
          ).strftime("%Y-%m-%d %H:%M:%S GMT+7")

          for filename in ("playlist.m3u", "vtv.m3u"):
              p = Path(filename)

              lines = p.read_text(
                  encoding="utf-8",
                  errors="replace"
              ).splitlines()

              lines = [
                  line for line in lines
                  if not line.startswith("#AUTO-UPDATED:")
              ]

              if lines and lines[0].startswith("#EXTM3U"):
                  lines.insert(1, f"#AUTO-UPDATED: {stamp}")
              else:
                  lines.insert(0, "#EXTM3U")
                  lines.insert(1, f"#AUTO-UPDATED: {stamp}")

              p.write_text(
                  "\n".join(lines) + "\n",
                  encoding="utf-8"
              )

          print(f"Đã force refresh: {stamp}")
          PY

      - name: Commit and push playlist
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u vtv.m3u

          if git diff --cached --quiet; then
            echo "::warning::Không phát hiện thay đổi dù đã refresh timestamp."
            exit 0
          fi

          git commit -m "Auto-update playlist"

          git pull --rebase origin master

          for i in 1 2 3; do
            if git push origin HEAD:master; then
              echo "Push thành công ở lần $i."
              exit 0
            fi

            echo "Push lần $i thất bại, đồng bộ lại rồi thử tiếp..."
            sleep 5
            git pull --rebase origin master
          done

          echo "::error::Push thất bại sau 3 lần."
          exit 1
