name: Auto Update Playlist With Logos

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/auto_sort.yml'
      - 'sort_m3u.py'

  schedule:
    # Chạy 30 phút/lần, tránh đầu giờ
    - cron: '7,37 * * * *'

  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: auto-update-playlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check playlist secret
        shell: bash
        env:
          SOURCE_PLAYLIST_URL: ${{ secrets.SOURCE_PLAYLIST_URL }}
        run: |
          if [ -z "$SOURCE_PLAYLIST_URL" ]; then
            echo "::error::Thiếu secret SOURCE_PLAYLIST_URL"
            exit 1
          fi
          echo "SOURCE_PLAYLIST_URL: OK"

      - name: Run playlist update
        env:
          SOURCE_PLAYLIST_URL: ${{ secrets.SOURCE_PLAYLIST_URL }}
        run: python sort_m3u.py

      - name: Validate playlist files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in ("playlist.m3u", "vtv.m3u"):
              p = Path(name)

              if not p.exists():
                  raise SystemExit(f"ERROR: {name} không tồn tại")

              data = p.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              if len(data) < 20:
                  raise SystemExit(f"ERROR: {name} quá nhỏ")

              if not data.startswith("#EXTM3U"):
                  raise SystemExit(
                      f"ERROR: {name} không phải M3U hợp lệ"
                  )

              print(f"{name}: OK - {len(data):,} ký tự")
          PY

      - name: Force update timestamp
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          vn = timezone(timedelta(hours=7))
          stamp = datetime.now(vn).strftime(
              "%Y-%m-%d %H:%M:%S GMT+7"
          )

          for name in ("playlist.m3u", "vtv.m3u"):
              p = Path(name)

              lines = p.read_text(
                  encoding="utf-8",
                  errors="replace"
              ).splitlines()

              lines = [
                  line for line in lines
                  if not line.startswith("#AUTO-UPDATED:")
              ]

              if lines and lines[0].startswith("#EXTM3U"):
                  lines.insert(
                      1,
                      f"#AUTO-UPDATED: {stamp}"
                  )
              else:
                  lines.insert(0, "#EXTM3U")
                  lines.insert(
                      1,
                      f"#AUTO-UPDATED: {stamp}"
                  )

              p.write_text(
                  "\n".join(lines) + "\n",
                  encoding="utf-8"
              )

          print(f"Refresh: {stamp}")
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u vtv.m3u

          if git diff --cached --quiet; then
            echo "Không có thay đổi, bỏ qua commit."
            exit 0
          fi

          git commit -m "chore: auto update playlist [skip ci]"

          git pull --rebase origin master
          git push origin HEAD:master
