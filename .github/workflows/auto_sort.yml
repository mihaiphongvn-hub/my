name: Auto Update Playlist With Logos

on:
  schedule:
    # Chạy mỗi 30 phút, lệch khỏi phút 00/30 để giảm khả năng GitHub bị trễ/drop
    - cron: '15,45 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-update-playlist-with-logos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check playlist secret
        shell: bash
        env:
          SOURCE_PLAYLIST_URL: ${{ secrets.SOURCE_PLAYLIST_URL }}
        run: |
          if [ -z "$SOURCE_PLAYLIST_URL" ]; then
            echo "::error::Thiếu secret SOURCE_PLAYLIST_URL"
            exit 1
          fi
          echo "Secret playlist: OK"

      - name: Update playlist and logos
        env:
          SOURCE_PLAYLIST_URL: ${{ secrets.SOURCE_PLAYLIST_URL }}
        run: python sort_m3u.py

      - name: Commit playlist changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u vtv.m3u

          if git diff --cached --quiet; then
            echo "Playlist không thay đổi."
            exit 0
          fi

          git commit -m "Auto-update playlist"

          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
