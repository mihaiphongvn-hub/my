name: Auto Update Playlist With Logos

on:
  schedule:
    - cron: '15,45 * * * *'
      timezone: 'Asia/Ho_Chi_Minh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-update-playlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check playlist secret
        shell: bash
        env:
          SOURCE_PLAYLIST_URL: ${{ secrets.SOURCE_PLAYLIST_URL }}
        run: |
          if [ -z "$SOURCE_PLAYLIST_URL" ]; then
            echo "::error::Thiếu secret SOURCE_PLAYLIST_URL"
            exit 1
          fi
          echo "SOURCE_PLAYLIST_URL: OK"

      - name: Update playlist and logos
        env:
          SOURCE_PLAYLIST_URL: ${{ secrets.SOURCE_PLAYLIST_URL }}
        run: python sort_m3u.py

      - name: Force refresh timestamp
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          vn = timezone(timedelta(hours=7))
          stamp = datetime.now(vn).strftime("%Y-%m-%d %H:%M:%S GMT+7")

          for filename in ("playlist.m3u", "vtv.m3u"):
              p = Path(filename)

              if not p.exists():
                  raise SystemExit(f"Không tìm thấy {filename}")

              lines = p.read_text(
                  encoding="utf-8",
                  errors="replace"
              ).splitlines()

              # Xóa timestamp cũ nếu có
              lines = [
                  line for line in lines
                  if not line.startswith("#AUTO-UPDATED:")
              ]

              # Chèn timestamp ngay sau #EXTM3U
              if lines and lines[0].startswith("#EXTM3U"):
                  lines.insert(1, f"#AUTO-UPDATED: {stamp}")
              else:
                  lines.insert(0, f"#AUTO-UPDATED: {stamp}")

              p.write_text(
                  "\n".join(lines) + "\n",
                  encoding="utf-8"
              )

          print(f"Đã cập nhật timestamp: {stamp}")
          PY

      - name: Commit playlist changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u vtv.m3u

          git commit -m "Auto-update playlist"

          git pull --rebase origin master
          git push origin master
