name: Auto Fetch and Sort M3U

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check required secret
        shell: bash
        env:
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
        run: |
          if [ -z "$SOURCE_URL" ]; then
            echo "::error::Thiếu GitHub Secret SOURCE_URL. Vào Settings > Secrets and variables > Actions để tạo."
            exit 1
          fi
          echo "Secret SOURCE_URL: OK"

      - name: Download and sort playlist
        env:
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
        run: python sort_m3u.py

      - name: Commit and push changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add vtv.m3u playlist.m3u

          if git diff --cached --quiet; then
            echo "Playlist không thay đổi."
            exit 0
          fi

          git commit -m "Auto-update playlist"
          git push
