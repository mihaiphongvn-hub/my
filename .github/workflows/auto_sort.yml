name: Auto Fetch and Sort M3U

on:
  schedule:
    # Chạy mỗi 1 tiếng
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download and sort playlist
        env:
          URL_VTV: ${{ secrets.URL_VTV }}
          URL_OTHER: ${{ secrets.URL_OTHER }}
        run: python sort_m3u.py

      - name: Commit and push only when playlist changed
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add vtv.m3u playlist.m3u

          if git diff --cached --quiet; then
            echo "Playlist không thay đổi."
            exit 0
          fi

          git commit -m "Auto-update playlist"
          git push
